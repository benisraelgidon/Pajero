name: Build Pajero firmware

# Runs when you push a change to the firmware, or when you tap "Run workflow"
# in the Actions tab (both doable from the GitHub phone app / mobile web).
on:
  push:
    paths:
      - 'pajero_node/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:        # manual button in the Actions tab

permissions:
  contents: write           # needed to publish the Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core + libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          # pin the core version so a surprise update can't break your build
          arduino-cli core install esp32:esp32@3.0.7
          arduino-cli lib install "PubSubClient" "ArduinoJson"
          # TinyGSM: the lewisxhe fork, installed from git (the stock one lacks SIM7672)
          arduino-cli lib install --git-url https://github.com/lewisxhe/TinyGSM-fork.git || true

      - name: Compile
        run: |
          # MUST match the OTA-capable scheme you flashed over USB, or the .bin
          # won't fit the partition. min_spiffs = 1.9MB app w/ OTA; default = 3MB.
          arduino-cli compile \
            --fqbn esp32:esp32:esp32s3:PartitionScheme=default_16MB,PSRAM=opi,FlashSize=16M \
            --export-binaries \
            pajero_node

      - name: Locate the application .bin and hash it
        id: bin
        run: |
          # the plain application binary (NOT .bootloader.bin / .partitions.bin / .merged.bin)
          BIN=$(find pajero_node/build -name 'pajero_node.ino.bin' | head -n1)
          if [ -z "$BIN" ]; then echo "no .bin produced"; exit 1; fi
          cp "$BIN" pajero_node.bin
          SHA=$(sha256sum pajero_node.bin | cut -d' ' -f1)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "### Firmware built" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA-256:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$SHA" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -l pajero_node.bin >> "$GITHUB_STEP_SUMMARY"

      - name: Publish as a Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fw-${{ github.run_number }}
          name: Firmware build ${{ github.run_number }}
          body: |
            Automated build.

            **SHA-256** (paste this into the app's Firmware update box):
            ```
            ${{ steps.bin.outputs.sha }}
            ```
            Download `pajero_node.bin` below, copy its URL, and send URL + SHA
            from the app.
          files: pajero_node.bin
